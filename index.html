<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#8B4513">

    <!-- APPLE -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <meta name="description" content="Lojinha de brigadeiros">

    <title>Brigadeiros da Loja</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" href="icon.png" type="image/png">
</head>

<body>

    <div class="container">

        <header class="header">
            <h1>🍫 Brigadeiros da Loja</h1>

            <button id="installBtn" class="btn install-btn" hidden>
                Instalar
            </button>
        </header>

        <section id="botaoNovoBrigadeiroSection" class="section">

            <button
                class="btn btn-large btn-success"
                onclick="toggleFormSection()">

                Novo Brigadeiro

            </button>

        </section>

        <section id="formSection" class="section form-section">

            <h2>Novo Brigadeiro</h2>

            <form id="brigadeiroForm">

                <!-- Nome -->

                <div class="form-group">

                    <label for="nomeBrigadeiro">
                        Nome do Brigadeiro
                    </label>

                    <input
                        type="text"
                        id="nomeBrigadeiro"
                        placeholder="Ex: Brigadeiro de Ninho"
                        required
                        autocomplete="off"
                    >

                </div>

                <!-- Descrição -->

                <div class="form-group">

                    <label for="descricao">
                        Descrição do Produto
                    </label>

                    <input
                        type="text"
                        id="descricao"
                        placeholder="Ex: Brigadeiro de chocolate com leite Ninho"
                        required
                        autocomplete="off"
                    >

                </div>

                <!-- Preço -->

                <div class="form-group">

                    <label for="preco">
                        Preço
                    </label>

                    <input
                        type="number"
                        id="preco"
                        placeholder="Ex: 3.50"
                        step="0.01"
                        min="0"
                        required
                    >

                </div>

                <!-- Imagem -->

                <div class="form-group">

                    <label for="imagem">
                        Imagem do Produto
                    </label>

                    <input
                        type="file"
                        id="imagem"
                        accept="image/*"
                        required
                    >

                </div>

                <!-- Botões -->

                <div class="form-actions">

                    <button
                        type="submit"
                        class="btn btn-primary">

                        Salvar

                    </button>

                    <button
                        type="button"
                        class="btn btn-secondary"
                        onclick="toggleFormSection()">

                        Cancelar

                    </button>

                </div>

            </form>

        </section>

        <section id="tabelaSection" class="section">

            <h2>🍫 Nossos Brigadeiros</h2>

            <div
                id="brigadeiroList"
                class="brigadeiro-list">

                <p class="empty-message">
                    Nenhum brigadeiro cadastrado.
                </p>

            </div>

        </section>

        <section id="carrinhoSection" class="section">

            <h2>🛒 Carrinho</h2>

            <div
                id="carrinhoList"
                class="carrinho-list">

                <p class="empty-message">
                    Seu carrinho está vazio.
                </p>

            </div>

            <div class="carrinho-total">

                <strong>

                    Total: R$

                    <span id="totalCarrinho">
                        0,00
                    </span>

                </strong>

            </div>

            <button
                id="finalizarBtn"
                class="btn btn-success"
                onclick="finalizarPedido()">

                Finalizar Pedido

            </button>

        </section>

    </div>

    <footer class="footer">

        <p>
            🍫 Brigadeiros da Loja
        </p>

    </footer>

    <script src="app.js"></script>

</body>

</html>
